name: Deploy pyutil

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - sydneyapp
          - pi-spello
          - spelloapp
          - MacMiniAU
          - MacMiniIT
          - all

# Note: We use git commands here rather than the gitrefresh.sh script so avoid conflicts with the script's behavior
jobs:
  deploy-sydneyapp:
    name: Deploy → sydneyapp
    if: ${{ inputs.environment == 'sydneyapp' || inputs.environment == 'all' }}
    runs-on: [self-hosted, sydneyapp]
    environment: sydneyapp        # triggers approval gate if configured in GitHub
    steps:
      - name: Pull latest from GitHub
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          cd ~/scripts/pyutil 
          git fetch origin
          git reset --hard "origin/$BRANCH"


  deploy-pi-spello:
    name: Deploy → pi-spello
    if: ${{ inputs.environment == 'pi-spello' || inputs.environment == 'all' }}
    runs-on: [self-hosted, pi-spello]
    environment: pi-spello
    steps:
      - name: Pull latest from GitHub
        run: |
          sudo --chdir=/home/pi/scripts/pyutil /home/pi/scripts/pyutil/gitrefresh.sh --yes

  deploy-spelloapp:
    name: Deploy → spelloapp
    if: ${{ inputs.environment == 'spelloapp' || inputs.environment == 'all' }}
    runs-on: [self-hosted, spelloapp]
    environment: spelloapp
    steps:
      - name: Pull latest from GitHub
        run: |
          sudo --chdir=/home/nick/scripts/pyutil /home/nick/scripts/pyutil/gitrefresh.sh --yes

  deploy-MacMiniAU:
    name: Deploy → MacMiniAU
    if: ${{ inputs.environment == 'MacMiniAU' || inputs.environment == 'all' }}
    runs-on: [self-hosted, MacMiniAU]
    environment: MacMiniAU
    steps:
      - name: Pull latest from GitHub
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          cd ~/scripts/pyutil 
          git fetch origin
          git reset --hard "origin/$BRANCH"

  deploy-MacMiniIT:
    name: Deploy → MacMiniIT
    if: ${{ inputs.environment == 'MacMiniIT' || inputs.environment == 'all' }}
    runs-on: [self-hosted, MacMiniIT]
    environment: MacMiniIT
    steps:
      - name: Pull latest from GitHub
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          cd ~/scripts/pyutil 
          ~/scripts/pyutil/gitrefresh.sh --yes --branch "$BRANCH"
          