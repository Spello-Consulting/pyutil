name: Deploy pyutil

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - sydneyapp
          - pi-spello
          - spelloapp
          - MacMiniAU
          - MacMiniIT
          - all

# pyutil holds the deploy scripts themselves, so it updates its clone with plain git
# commands rather than gitrefresh.sh. On Linux the runner user needs matching sudoers
# entries; see docs/deployment/linux-host.md in the automation repo.
jobs:
  deploy-sydneyapp:
    name: Deploy → sydneyapp
    if: ${{ inputs.environment == 'sydneyapp' || inputs.environment == 'all' }}
    runs-on: [self-hosted, sydneyapp]
    environment: sydneyapp        # triggers approval gate if configured in GitHub
    steps:
      - name: Pull latest from GitHub
        run: |
          sudo -n -u nick /usr/bin/git -C /home/nick/scripts/pyutil fetch origin
          sudo -n -u nick /usr/bin/git -C /home/nick/scripts/pyutil reset --hard origin/main

  deploy-pi-spello:
    name: Deploy → pi-spello
    if: ${{ inputs.environment == 'pi-spello' || inputs.environment == 'all' }}
    runs-on: [self-hosted, pi-spello]
    environment: pi-spello
    steps:
      - name: Pull latest from GitHub
        run: |
          sudo -n -u nick /usr/bin/git -C /home/nick/scripts/pyutil fetch origin
          sudo -n -u nick /usr/bin/git -C /home/nick/scripts/pyutil reset --hard origin/main

  deploy-spelloapp:
    name: Deploy → spelloapp
    if: ${{ inputs.environment == 'spelloapp' || inputs.environment == 'all' }}
    runs-on: [self-hosted, spelloapp]
    environment: spelloapp
    steps:
      - name: Pull latest from GitHub
        run: |
          sudo -n -u nick /usr/bin/git -C /home/nick/scripts/pyutil fetch origin
          sudo -n -u nick /usr/bin/git -C /home/nick/scripts/pyutil reset --hard origin/main

  # The macOS runners run as nick, so no sudo is needed.
  deploy-MacMiniAU:
    name: Deploy → MacMiniAU
    if: ${{ inputs.environment == 'MacMiniAU' || inputs.environment == 'all' }}
    runs-on: [self-hosted, MacMiniAU]
    environment: MacMiniAU
    steps:
      - name: Pull latest from GitHub
        run: |
          git -C /Users/nick/scripts/pyutil fetch origin
          git -C /Users/nick/scripts/pyutil reset --hard origin/main

  deploy-MacMiniIT:
    name: Deploy → MacMiniIT
    if: ${{ inputs.environment == 'MacMiniIT' || inputs.environment == 'all' }}
    runs-on: [self-hosted, MacMiniIT]
    environment: MacMiniIT
    steps:
      - name: Pull latest from GitHub
        run: |
          git -C /Users/nick/scripts/pyutil fetch origin
          git -C /Users/nick/scripts/pyutil reset --hard origin/main
