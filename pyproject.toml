[project]
name = "pyutil"
version = "1.1.4"
description = "Shared shell tooling and dev-environment scripts."
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=8",
    "pyyaml>=6.0.4",
    "types-pyyaml>=6.0.12.20261122",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
