# Modelled on finance_orchestrator's deploy workflow: one matrix job for both Mac minis.
name: Deploy Demo

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - MacMiniIT
          - MacMiniAU
          - both

jobs:
  deploy:
    name: Deploy → ${{ matrix.environment }}
    runs-on: [self-hosted, "${{ matrix.environment }}"]
    environment: ${{ matrix.environment }}
    strategy:
      matrix:
        environment: ${{ fromJSON(inputs.environment == 'both' && '["MacMiniIT","MacMiniAU"]' || format('["{0}"]', inputs.environment)) }}
    steps:
      - name: Pull latest from GitHub
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          cd ~/scripts/Demo
          ~/scripts/pyutil/gitrefresh.sh --yes --branch "$BRANCH"

      - name: Deploy the user agent on the production Mac only
        if: matrix.environment == 'MacMiniAU'
        run: |
          cd ~/scripts/Demo && ~/scripts/pyutil/useragentctrl.sh --yes deploy
