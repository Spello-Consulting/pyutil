# Modelled on PowerController's deploy workflow: one job per Linux host.
name: Deploy Demo

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - sydneyapp
          - pi-spello
          - all

jobs:
  deploy-sydneyapp:
    name: Deploy → sydneyapp
    if: ${{ inputs.environment == 'sydneyapp' || inputs.environment == 'all' }}
    runs-on: [self-hosted, sydneyapp]
    environment: sydneyapp
    steps:
      - name: Stop the service
        run: |
          sudo --chdir=/home/nick/scripts/Demo /home/nick/scripts/pyutil/servicectrl.sh stop

      - name: Pull latest from GitHub
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          sudo --chdir=/home/nick/scripts/Demo /home/nick/scripts/pyutil/gitrefresh.sh --yes --branch "$BRANCH"

      - name: Deploy and start the service
        run: sudo --chdir=/home/nick/scripts/Demo /home/nick/scripts/pyutil/servicectrl.sh deploy sydneyapp

      - name: Verify service is running
        run: |
          sleep 6
          sudo --chdir=/home/nick/scripts/Demo /home/nick/scripts/pyutil/servicectrl.sh is-active

  deploy-pi-spello:
    name: Deploy → pi-spello
    if: ${{ inputs.environment == 'pi-spello' || inputs.environment == 'all' }}
    runs-on: [self-hosted, Pi-Spello]
    steps:
      - name: Pull latest from GitHub
        run: sudo /usr/bin/git -C /home/pi/scripts/Demo pull

  lint:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get install -y shellcheck
